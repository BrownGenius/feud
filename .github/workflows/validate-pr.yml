name: Validate PR & Decks

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate JS, Decks & Version Tags
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run repository & deck validator
        run: node scripts/validate-repo.js

      - name: Verify decks/manifest.json is up to date
        run: |
          node scripts/generate-manifest.js
          if ! git diff --quiet decks/manifest.json; then
            echo "❌ decks/manifest.json is out of date. Run 'node scripts/generate-manifest.js' and commit the result."
            git diff decks/manifest.json
            exit 1
          fi

      - name: Run core logic & state engine unit tests
        run: node scripts/test-core.js

      - name: Run headless browser E2E UI & gameplay smoke tests
        run: node scripts/test-ui-e2e.js
