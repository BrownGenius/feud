name: Update Deck Manifest

on:
  push:
    branches:
      - main
    paths:
      - 'decks/**'
      - 'scripts/generate-manifest.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate decks/manifest.json
        run: node scripts/generate-manifest.js

      - name: Commit updated manifest if changed
        run: |
          if git diff --quiet decks/manifest.json; then
            echo "decks/manifest.json is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add decks/manifest.json
          git commit -m "chore(decks): update decks/manifest.json [skip ci]"
          git push
