<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Party Feud — Printable Question &amp; Answer Review Sheet</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="./icons/icon.svg" />
  <style>
    :root {
      --ink: #0f172a;
      --muted: #475569;
      --border: #cbd5e1;
      --bg: #f1f5f9;
      --card: #ffffff;
      --gold: #f59e0b;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px 28px 48px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--ink);
      background: var(--bg);
      line-height: 1.4;
    }

    .review-container {
      max-width: 1180px;
      margin: 0 auto;
    }

    /* Sticky control bar (hidden when printing) */
    .review-toolbar {
      position: sticky;
      top: 12px;
      z-index: 100;
      background: #0f172a;
      color: #ffffff;
      border: 2px solid #fbbf24;
      border-radius: 14px;
      padding: 12px 16px;
      margin-bottom: 22px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      box-shadow: 0 10px 28px rgba(15, 23, 42, 0.25);
    }

    .toolbar-left,
    .toolbar-right {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
    }

    .toolbar-label {
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #fde68a;
    }

    .toolbar-select,
    .toolbar-search {
      min-height: 36px;
      padding: 6px 10px;
      border-radius: 8px;
      border: 1.5px solid #475569;
      background: #1e293b;
      color: #ffffff;
      font-size: 13px;
      font-weight: 600;
    }

    .toolbar-search {
      min-width: 190px;
    }

    .toolbar-btn {
      cursor: pointer;
      min-height: 36px;
      padding: 7px 14px;
      border-radius: 8px;
      border: 1.5px solid #fbbf24;
      background: #fbbf24;
      color: #0f172a;
      font-size: 13px;
      font-weight: 800;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .toolbar-btn.secondary {
      background: #1e293b;
      color: #fef08a;
      border-color: #64748b;
    }

    .toolbar-btn:hover {
      filter: brightness(1.06);
    }

    /* Document Header */
    .doc-header {
      background: #ffffff;
      border: 2px solid #0f172a;
      border-radius: 12px;
      padding: 16px 20px;
      margin-bottom: 22px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .doc-title {
      margin: 0;
      font-size: 24px;
      font-weight: 900;
      color: #0f172a;
    }

    .doc-subtitle {
      margin: 4px 0 0;
      font-size: 13px;
      color: var(--muted);
      font-weight: 600;
    }

    .summary-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .summary-pill {
      padding: 5px 11px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800;
      background: #f1f5f9;
      border: 1.5px solid #94a3b8;
      color: #0f172a;
    }

    .summary-pill.lvl-1 { background: #e0f2fe; border-color: #0284c7; color: #075985; }
    .summary-pill.lvl-2 { background: #fef3c7; border-color: #d97706; color: #92400e; }
    .summary-pill.lvl-3 { background: #fee2e2; border-color: #dc2626; color: #991b1b; }
    .summary-pill.lvl-fm { background: #ede9fe; border-color: #7c3aed; color: #5b21b6; }

    /* Sections by Level */
    .level-section {
      margin-bottom: 28px;
    }

    .level-heading {
      font-size: 17px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      background: #e2e8f0;
      padding: 9px 14px;
      border-left: 6px solid #0f172a;
      border-radius: 8px;
      margin: 0 0 12px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .level-heading.lvl-1 { border-left-color: #0284c7; }
    .level-heading.lvl-2 { border-left-color: #d97706; }
    .level-heading.lvl-3 { border-left-color: #dc2626; }
    .level-heading.lvl-fm { border-left-color: #7c3aed; }

    .level-heading span {
      font-size: 12px;
      color: var(--muted);
      font-weight: 700;
    }

    /* 2-Column Question Grid */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }

    @media (max-width: 760px) {
      .review-toolbar {
        position: static;
      }
      .cards-grid {
        grid-template-columns: 1fr;
      }
    }

    .q-card {
      background: var(--card);
      border: 1.5px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      break-inside: avoid;
      page-break-inside: avoid;
      box-shadow: 0 2px 5px rgba(15, 23, 42, 0.04);
    }

    .q-card-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      font-weight: 800;
      color: var(--muted);
      text-transform: uppercase;
    }

    .q-mult {
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 800;
      background: #e0f2fe;
      border: 1px solid #0284c7;
      color: #075985;
    }

    .q-mult.mult-2 {
      background: #fef3c7;
      border-color: #d97706;
      color: #92400e;
    }

    .q-mult.mult-3 {
      background: #fee2e2;
      border-color: #dc2626;
      color: #991b1b;
    }

    .q-card.is-used {
      opacity: 0.68;
      background: #f8fafc;
      border-style: dashed;
    }

    .card-used-toggle {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      font-weight: 800;
      color: var(--ink);
      cursor: pointer;
      text-transform: none;
      padding: 2px 7px;
      border-radius: 999px;
      background: #dcfce7;
      border: 1px solid #22c55e;
      color: #166534;
    }

    .card-used-toggle.is-used {
      background: #fee2e2;
      border-color: #ef4444;
      color: #991b1b;
    }

    .card-used-toggle input {
      width: 13px;
      height: 13px;
      accent-color: #991b1b;
      cursor: pointer;
    }

    .q-theme {
      font-size: 11px;
      color: #64748b;
      margin-top: 2px;
      font-weight: 600;
    }

    .q-prompt {
      font-size: 15px;
      font-weight: 800;
      color: #0f172a;
      margin: 6px 0 8px 0;
      line-height: 1.3;
    }

    .ans-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12.5px;
    }

    .ans-table th {
      text-align: left;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #64748b;
      padding: 3px 6px;
      border-bottom: 1.5px solid #cbd5e1;
    }

    .ans-table td {
      padding: 4px 6px;
      border-bottom: 1px solid #e2e8f0;
      vertical-align: top;
    }

    .ans-table tr:last-child td {
      border-bottom: none;
    }

    .col-rank {
      width: 32px;
      font-weight: 800;
      color: #64748b;
    }

    .col-ans {
      font-weight: 600;
      color: #1e293b;
    }

    .col-pts {
      width: 82px;
      text-align: right;
      font-weight: 800;
      color: #0f172a;
      white-space: nowrap;
    }

    .col-pts .scaled {
      color: #64748b;
      font-weight: 600;
      font-size: 11px;
    }

    .fm-hint {
      font-size: 11.5px;
      color: #475569;
      margin-top: 3px;
      font-weight: 500;
    }

    /* Answer toggle buttons & reveal bars */
    .ans-toggle-btn {
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 8px;
      font-size: 11px;
      font-weight: 700;
      color: #334155;
      background: #f1f5f9;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      transition: all 0.15s ease;
      white-space: nowrap;
    }

    .ans-toggle-btn:hover {
      background: #e2e8f0;
      color: #0f172a;
      border-color: #94a3b8;
    }

    .ans-reveal-placeholder {
      margin-top: 8px;
      display: flex;
    }

    .ans-reveal-bar-btn {
      cursor: pointer;
      width: 100%;
      padding: 8px 12px;
      background: #f8fafc;
      border: 1.5px dashed #cbd5e1;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      color: #475569;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.15s ease;
    }

    .ans-reveal-bar-btn:hover {
      background: #eff6ff;
      border-color: #3b82f6;
      color: #1d4ed8;
      border-style: solid;
    }

    /* Answers hidden states */
    .q-card.answers-hidden .ans-table-wrap {
      display: none;
    }

    .q-card:not(.answers-hidden) .ans-reveal-placeholder {
      display: none;
    }

    .fm-card.answers-hidden .fm-hint {
      display: none;
    }

    .fm-card.answers-hidden .fm-reveal-placeholder {
      display: flex;
    }

    .fm-card:not(.answers-hidden) .fm-reveal-placeholder {
      display: none;
    }

    .doc-subtitle-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      margin-top: 4px;
    }

    .answer-status-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 2px 9px;
      border-radius: 999px;
      font-size: 11.5px;
      font-weight: 800;
      background: #fef3c7;
      border: 1px solid #f59e0b;
      color: #92400e;
    }

    .answer-status-pill.all-visible {
      background: #dcfce7;
      border-color: #22c55e;
      color: #166534;
    }

    @media print {
      body {
        background: #ffffff;
        padding: 0;
      }
      .review-toolbar {
        display: none !important;
      }
      .doc-header {
        margin-bottom: 14px;
        padding: 10px 14px;
      }
      .cards-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
      }
      .q-card {
        box-shadow: none;
        border-color: #94a3b8;
        padding: 9px 11px;
      }
      .ans-toggle-btn,
      .ans-reveal-placeholder,
      .card-edit-btn {
        display: none !important;
      }
    }

    .card-edit-btn {
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
      border: 1px solid #cbd5e1;
      background: #ffffff;
      color: #1e293b;
      cursor: pointer;
    }

    .card-edit-btn:hover {
      background: #f1f5f9;
      border-color: #94a3b8;
    }

    .q-card.is-editing {
      border-color: #f59e0b;
      box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.22);
    }

    .inline-edit-body {
      padding: 12px 14px 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: #fffbeb;
    }

    .inline-edit-field {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .inline-edit-field label {
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: #475569;
    }

    .inline-edit-input {
      width: 100%;
      padding: 7px 10px;
      border: 1px solid #cbd5e1;
      border-radius: 7px;
      font-size: 13px;
      font-family: inherit;
      color: #0f172a;
      background: #ffffff;
    }

    .inline-edit-ans-row {
      display: grid;
      grid-template-columns: 26px 1fr 74px 30px;
      gap: 6px;
      align-items: center;
    }

    .inline-edit-rank {
      font-size: 12px;
      font-weight: 800;
      color: #64748b;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="review-container">
    <!-- Top Control Bar (Hidden when printing) -->
    <nav class="review-toolbar">
      <div class="toolbar-left">
        <a href="./index.html" id="btnBackToGame" class="toolbar-btn secondary" onclick="if(window.opener && !window.opener.closed){window.opener.focus(); window.close(); return false;} const from=new URLSearchParams(window.location.search).get('from'); if(from==='setup'){window.location.href='./index.html?returnTo=setup'; return false;} if(window.history.length > 1 && document.referrer){window.history.back(); return false;}">◀ Back to Game</a>

        <div>
          <label class="toolbar-label" for="reviewDeckTagFilter">Category:</label>
          <select id="reviewDeckTagFilter" class="toolbar-select" title="Filter decks by category"></select>
        </div>

        <div>
          <label class="toolbar-label" for="reviewDeckSelect">Deck:</label>
          <select id="reviewDeckSelect" class="toolbar-select"></select>
        </div>

        <div style="display:flex; align-items:center; gap:6px; flex-wrap:wrap;">
          <button id="btnReviewScanFolder" type="button" class="toolbar-btn secondary" title="Scan your local decks/ folder to load .json decks offline">📂 Scan Folder</button>
          <button id="btnReviewRescanFolder" type="button" class="toolbar-btn secondary" style="display:none;" title="Re-read decks from your previously linked folder">🔄 Re-scan</button>
          <button id="btnReviewLoadFile" type="button" class="toolbar-btn secondary" title="Load a custom .json deck file">📄 Load File</button>
          <input id="reviewFolderInput" type="file" webkitdirectory multiple accept=".json" style="display:none;" />
          <input id="reviewFileInput" type="file" multiple accept=".json" style="display:none;" />
        </div>

        <div>
          <label class="toolbar-label" for="reviewLevelFilter">Level:</label>
          <select id="reviewLevelFilter" class="toolbar-select">
            <option value="all">All Levels &amp; Fast Money</option>
            <option value="1">1x Single-Point Rounds Only</option>
            <option value="2">2x Double-Point Rounds Only</option>
            <option value="3">3x Triple-Point Rounds Only</option>
            <option value="tie">Tie-Breaker Rounds Only</option>
            <option value="fm">Fast Money Bonus Only</option>
          </select>
        </div>

        <input
          id="reviewSearchInput"
          type="search"
          class="toolbar-search"
          placeholder="🔍 Filter questions or answers…"
        />
      </div>

      <div class="toolbar-right">
        <button id="btnMarkAllUsed" type="button" class="toolbar-btn secondary" title="Mark all visible rounds as Used">
          ☑️ Mark All Used
        </button>
        <button id="btnMarkAllUnused" type="button" class="toolbar-btn secondary" title="Mark all visible rounds as Unused">
          ☐ Mark All Unused
        </button>
        <button id="btnToggleAllAnswers" type="button" class="toolbar-btn secondary" title="Show or hide survey answers across all cards">
          👁️ Show All Answers
        </button>
        <button id="btnCopyShareUrl" type="button" class="toolbar-btn secondary" title="Copy shareable link to this deck review page">
          🔗 Copy Share Link
        </button>
        <button id="btnSaveToLocalFile" type="button" class="toolbar-btn secondary" title="Save edits directly back to your local .json file">
          📁 Save to Local File
        </button>
        <button id="btnDownloadDeckJson" type="button" class="toolbar-btn secondary" title="Download current deck (with any edits) as a .json file">
          💾 Download .json
        </button>
        <button type="button" class="toolbar-btn" onclick="window.print()">
          🖨️ Print / Save as PDF
        </button>
      </div>
    </nav>

    <!-- Printable Document Header -->
    <header class="doc-header">
      <div>
        <h1 id="reviewDocTitle" class="doc-title">🎉 Party Feud — Question &amp; Answer Review</h1>
        <div class="doc-subtitle-row">
          <p id="reviewDocSub" class="doc-subtitle" style="margin:0;">Printable Host &amp; Survey Review Sheet</p>
          <span id="reviewAnswersStatePill" class="answer-status-pill">🔒 Answers Hidden by Default</span>
        </div>
      </div>
      <div id="reviewSummaryPills" class="summary-pills"></div>
    </header>

    <!-- Dynamic Question Sections -->
    <main id="reviewContentRoot"></main>
  </div>

  <script src="./js/state.js?v=20261127b"></script>
  <script src="./js/formats.js?v=20261127b"></script>
  <script src="./js/decks.js?v=20261127b"></script>
  <script src="./js/review.js?v=20261127b"></script>
</body>
</html>
